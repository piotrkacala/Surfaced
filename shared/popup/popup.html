<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<script>
(async () => {
  const { os } = await browser.runtime.getPlatformInfo();
  location.replace(os === "android" ? "android/popup.html" : "desktop/popup.html");
})();
</script>
</body>
</html>
