<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <title>Surfaced Chrome Small Promo Tile</title>
  <style>
    :root {
      --deep: #020d1a;
      --mid: #061f36;
      --accent: #00d4ff;
      --text: #effaff;
      --muted: #8ebacf;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 440px;
      height: 280px;
      margin: 0;
      overflow: hidden;
      background: var(--deep);
      font-family: "Noto Sans", "Arial", sans-serif;
    }

    .tile {
      position: relative;
      width: 440px;
      height: 280px;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 88% 18%, rgba(0, 212, 255, 0.16), transparent 28%),
        linear-gradient(120deg, var(--mid) 0%, #031426 52%, var(--deep) 100%);
    }

    .arc {
      position: absolute;
      border: 1.5px solid rgba(0, 212, 255, 0.16);
      border-color: rgba(0, 212, 255, 0.16) transparent transparent transparent;
      border-radius: 50%;
      pointer-events: none;
    }

    .arc.one {
      right: 12px;
      top: 12px;
      width: 190px;
      height: 64px;
      transform: rotate(7deg);
    }

    .arc.two {
      right: -26px;
      bottom: 28px;
      width: 238px;
      height: 72px;
      opacity: 0.8;
      transform: rotate(-8deg);
    }

    .arc.three {
      left: -14px;
      bottom: 40px;
      width: 210px;
      height: 66px;
      border-color: rgba(127, 179, 200, 0.14) transparent transparent transparent;
      transform: rotate(-10deg);
    }

    .brand {
      position: absolute;
      left: 28px;
      top: 30px;
      width: 184px;
      z-index: 3;
    }

    .icon {
      width: 54px;
      height: 54px;
      border: 1px solid rgba(0, 212, 255, 0.34);
      border-radius: 14px;
      background: linear-gradient(135deg, #04162a, #020e1e);
    }

    h1 {
      margin: 14px 0 0;
      font-size: 40px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .tagline {
      margin: 10px 0 0 2px;
      color: #d9f3ff;
      font-size: 25px;
      line-height: 1.18;
      letter-spacing: 0;
      font-weight: 800;
    }

    .privacy {
      margin: 18px 0 0 3px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 700;
    }

    .browser-card {
      position: absolute;
      right: 18px;
      top: 48px;
      width: 202px;
      height: 166px;
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 18px;
      background: #071929;
      box-shadow: 0 16px 32px rgba(0, 9, 20, 0.45);
      opacity: 0.96;
    }

    .browser-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 47% 55%;
      filter: blur(0.8px) saturate(0.9) brightness(0.72);
      transform: scale(1.05);
    }

    .browser-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(2, 13, 26, 0.2), rgba(2, 13, 26, 0.54)),
        linear-gradient(90deg, rgba(2, 13, 26, 0.3), rgba(2, 13, 26, 0));
    }

    .reminder {
      position: absolute;
      right: 24px;
      bottom: 38px;
      display: flex;
      align-items: center;
      gap: 11px;
      width: 218px;
      min-height: 58px;
      padding: 11px 15px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 13px;
      background: rgba(7, 25, 41, 0.96);
      box-shadow: 0 13px 24px rgba(0, 9, 20, 0.42);
      z-index: 4;
    }

    .mini-icon {
      flex: 0 0 auto;
      width: 29px;
      height: 29px;
      border: 1px solid rgba(0, 212, 255, 0.28);
      border-radius: 8px;
      background: #09293d;
    }

    .reminder strong {
      display: block;
      color: #eaf9ff;
      font-size: 13.5px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .reminder span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="tile" aria-label="Surfaced promotional tile">
    <div class="arc one"></div>
    <div class="arc two"></div>
    <div class="arc three"></div>

    <section class="brand">
      <svg class="icon" viewBox="0 0 54 54" aria-hidden="true">
        <polyline points="10 12 27 25 44 12" fill="none" stroke="#00d4ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="10 27 27 40 44 27" fill="none" stroke="#00d4ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.56"/>
        <polyline points="10 41 27 54 44 41" fill="none" stroke="#00d4ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
      </svg>
      <h1>Surfaced</h1>
      <div class="tagline">Gentle scroll<br>reminders</div>
      <div class="privacy">Private. Local. Calm.</div>
    </section>

    <figure class="browser-card" aria-hidden="true">
      <img src="../../screenshots/amo-s1-desktop-reminder-context.png" alt="">
    </figure>

    <aside class="reminder" aria-hidden="true">
      <svg class="mini-icon" viewBox="0 0 29 29">
        <polyline points="7 8 14.5 14 22 8" fill="none" stroke="#00d4ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="7 15 14.5 21 22 15" fill="none" stroke="#00d4ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.52"/>
      </svg>
      <div>
        <strong>Come up for air.</strong>
        <span>Surfaced gently reminds you.</span>
      </div>
    </aside>
  </main>
</body>
</html>
