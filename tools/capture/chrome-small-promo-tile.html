<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <title>Surfaced Chrome Small Promo Tile</title>
  <style>
    /* Dark on purpose, unlike the light screenshots: Chrome's image guidelines ask
       promo tiles to avoid large white or light gray areas. */
    :root {
      --deep: #0f1b23;
      --mid: #12404e;
      --accent: #5fcfe1;
      --text: #e6eff4;
      --muted: #9db0bc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 440px;
      height: 280px;
      margin: 0;
      overflow: hidden;
      background: var(--deep);
      font-family: "Noto Sans", "Arial", sans-serif;
    }

    .tile {
      position: relative;
      width: 440px;
      height: 280px;
      overflow: hidden;
      color: var(--text);
      background: linear-gradient(120deg, var(--mid) 0%, var(--deep) 68%);
    }

    .brand {
      position: absolute;
      left: 28px;
      top: 30px;
      width: 184px;
      z-index: 3;
    }

    .icon {
      width: 54px;
      height: 54px;
      border: 1px solid rgba(95, 207, 225, 0.34);
      border-radius: 14px;
      background: var(--deep);
    }

    .icon polyline,
    .mini-icon polyline {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon polyline {
      stroke: var(--accent);
      stroke-width: 5.5;
    }

    h1 {
      margin: 14px 0 0;
      font-size: 40px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .tagline {
      margin: 10px 0 0 2px;
      font-size: 25px;
      line-height: 1.18;
      letter-spacing: 0;
      font-weight: 800;
    }

    .privacy {
      margin: 18px 0 0 3px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 700;
    }

    .browser-card {
      position: absolute;
      right: 18px;
      top: 48px;
      width: 202px;
      height: 166px;
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: #172530;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .browser-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 55%;
      filter: blur(0.8px);
      transform: scale(1.05);
    }

    .reminder {
      position: absolute;
      right: 24px;
      bottom: 38px;
      display: flex;
      align-items: center;
      gap: 11px;
      width: 218px;
      min-height: 58px;
      padding: 11px 15px;
      border: 1px solid rgba(19, 41, 58, 0.12);
      border-radius: 13px;
      background: #ffffff;
      box-shadow: 0 13px 24px rgba(0, 0, 0, 0.32);
      z-index: 4;
    }

    .mini-icon {
      flex: 0 0 auto;
      width: 29px;
      height: 29px;
      border-radius: 8px;
      background: rgba(11, 138, 163, 0.1);
    }

    .mini-icon polyline {
      stroke: #0b8aa3;
      stroke-width: 2.1;
    }

    .reminder strong {
      display: block;
      color: #13293a;
      font-size: 13.5px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .reminder span {
      display: block;
      margin-top: 4px;
      color: #576c7b;
      font-size: 11px;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="tile" aria-label="Surfaced promotional tile">
    <section class="brand">
      <svg class="icon" viewBox="0 0 54 54" aria-hidden="true">
        <polyline points="10 12 27 25 44 12" />
        <polyline points="10 27 27 40 44 27" opacity="0.55" />
        <polyline points="10 41 27 54 44 41" opacity="0.35" />
      </svg>
      <h1>Surfaced</h1>
      <div class="tagline">Gentle scroll<br>reminders</div>
      <div class="privacy">Private. Local. Calm.</div>
    </section>

    <figure class="browser-card" aria-hidden="true">
      <img src="../../output/playwright/promo-tile-backdrop.png" alt="">
    </figure>

    <aside class="reminder" aria-hidden="true">
      <svg class="mini-icon" viewBox="0 0 29 29">
        <polyline points="7 8 14.5 14 22 8" />
        <polyline points="7 15 14.5 21 22 15" opacity="0.55" />
      </svg>
      <div>
        <strong>Come up for air.</strong>
        <span>Surfaced gently reminds you.</span>
      </div>
    </aside>
  </main>
  <script>
    // capture-assets.mjs waits for this, so a missing backdrop fails the capture.
    document.querySelector(".browser-card img").decode().then(() => {
      document.documentElement.dataset.ready = "1";
    });
  </script>
</body>
</html>
